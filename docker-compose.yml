# Self-host Cadence — a Spotify-like web client for YOUR Navidrome server.
#
#   docker compose up -d
#
# Then open http://localhost:8095 and, on the sign-in screen, enter your
# Navidrome server address (e.g. https://navidrome.example.com) plus your
# Navidrome username and password. The server address is remembered on the
# device.
#
# The image is server-agnostic — nothing about your server is baked in. Put it
# behind your own HTTPS reverse proxy (Caddy, nginx, Traefik, cloudflared…) for
# remote access; the browser talks to Navidrome directly, so your Navidrome
# server must be reachable from the browser and send permissive CORS headers.
services:
  cadence:
    image: mrorbitman/cadence:latest
    container_name: cadence
    ports:
      - '8095:80'
    restart: unless-stopped
    # environment:
    #   # Optional: pre-fill the sign-in Server field with your Navidrome URL so
    #   # users don't type it (they can still override). Applied at container
    #   # start — no rebuild.
    #   NAVIDROME_URL: https://navidrome.example.com
    #   # Optional: show a "Sign up" link on the sign-in screen pointing at your
    #   # own registration/invite page.
    #   SIGNUP_URL: https://your-server.example/signup
