# Cadence PWA — THE compose file for the cadence.jpc.io deploy (a Dockge stack
# on umbrel, fronted by cloudflared). This file is the source of truth: it is
# copied verbatim to the stack dir by `scripts/deploy-umbrel.sh`, never edited
# on the server. Everything deployment-specific lives in the stack's `.env`
# beside it (server-side only, never committed):
#
#   CADENCE_TAG      image tag to run (CI publishes sha-<short> + latest)
#   JELLYFIN_URL     prefilled sign-in server (runtime config.js, no rebuild)
#   SIGNUP_URL       optional "Sign up" link on the sign-in screen
#   MARLIN_URL       optional: nginx proxies same-origin /api/search to marlin
#   MARLIN_TOKEN       …and injects this token server-side (never reaches the browser)
#   LIDARR_URL       optional: nginx proxies a curated /api/lidarr/* allowlist
#   LIDARR_API_KEY     …injecting this WRITE key server-side
#
# Unset optional values switch their feature off. The Jellyfin address never
# lives in the image or the bundle — `deploy-umbrel.sh deploy` verifies that.
services:
  cadence:
    image: mrorbitman/cadence:${CADENCE_TAG:-latest}
    container_name: cadence
    ports:
      - '8095:80'
    restart: unless-stopped
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      SIGNUP_URL: ${SIGNUP_URL:-}
      MARLIN_URL: ${MARLIN_URL:-}
      MARLIN_TOKEN: ${MARLIN_TOKEN:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
