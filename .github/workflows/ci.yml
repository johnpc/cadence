name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: main-push runs and PR runs get SEPARATE groups so a PR run can
# never cancel an in-progress main run. That mattered because the iOS deploy is
# gated on a SUCCESSFUL main CI (workflow_run) — when a single shared group let a
# PR push cancel the main run, main CI showed "cancelled", so the deploy never
# fired. Now:
#   - push to main → group "ci-main", never cancelled (every merged commit is
#     verified end to end, and reaches `success` so iOS Deploy triggers).
#   - a PR → group "ci-pr-<ref>", cancel-in-progress so a new commit on that PR
#     supersedes its own older run.
# Trade-off: a PR run and a main run can briefly overlap on the shared Jellyfin
# (only during a merge), which the suite tolerates (workers:1 + retries keep each
# run gentle); the old strict repo-wide serialization was cancelling main, which
# was the worse failure.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, Test, Coverage, CRAP & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: File-length discipline (max 100 lines)
        run: npm run check:lines

      - name: Feature coverage (every .feature maps to an acceptance area)
        run: npm run check:features

      - name: Unit tests with coverage (80% floor)
        run: npm run test:coverage

      - name: CRAP score analysis (threshold 15)
        run: npm run crap

      - name: Build
        run: npm run build

      - name: Bundle size budget
        # Fails if the gzipped entry/vendor/route chunks exceed .size-limit.json
        # — catches silent bundle bloat we control (deps, imports), unlike the
        # tunnel-noisy runtime metrics.
        run: npm run size

      - name: Lighthouse CI (a11y / best-practices / TBT / CLS)
        # Audits the built static shell (dist/, its own server — no Jellyfin
        # needed). GATES accessibility + best-practices (≥0.9) + TBT + CLS; LCP/
        # TTI/perf-score are WARN only (dominated by Ionic bundle parse + the
        # runtime Jellyfin tunnel, so noisy to gate). Report uploads to LHCI's
        # temporary public storage (link in the log).
        run: npm run lhci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  ios-tests:
    # Native Swift unit tests for the iOS now-playing bridge (MPNowPlayingInfoCenter
    # + MPRemoteCommandCenter). Host-less (compiles NowPlayingBridge.swift straight
    # into the bundle — no Capacitor/Pods link), so it's a quick simulator run that
    # guards the durable-Now-Playing + prev/next-track behavior that can't be caught
    # by the JS suite. Complements the native-playback Gherkin area (JS half).
    name: iOS Swift Tests
    # Self-hosted Mac Mini. This job also runs on pull_request, and self-hosted
    # runners on a public repo are unsafe for fork PRs (arbitrary code exec) —
    # so only run it for push-to-main or a PR authored by the repo owner.
    # Everyone else's PRs simply skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No setup-node cache on the self-hosted Mac mini: ~/.npm persists there, and saving it was a ~1.8 GB upload per run.
          package-manager-cache: false

      # The Podfile references pods by path under node_modules/@capacitor/*, so the
      # JS deps must be present before pod install / the xcodebuild resolves them.
      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: cd ios/App && pod install

      # Add the AppTests target + shared scheme to the (generated) xcodeproj.
      # Idempotent, so a committed target is fine too.
      - name: Ensure AppTests target
        run: cd ios/App && ruby add_test_target.rb

      - name: Run Swift unit tests
        run: |
          cd ios/App
          xcodebuild test \
            -workspace App.xcworkspace \
            -scheme AppTests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -quiet

  acceptance:
    # One job per feature area, each its own independent check, so a red X points
    # at the area that broke. Tests hit the real Jellyfin server (base URL is
    # baked into the build via VITE_JELLYFIN_URL).
    name: Acceptance Tests (${{ matrix.area.name }})
    runs-on: ubuntu-latest
    # Hard cap per area. It surfaces hangs (e.g. sign-in never succeeding) as a
    # fast red X with the real error in the log — it is not a retry budget.
    timeout-minutes: 25
    strategy:
      # Let every area run even if one fails — a lone failure shouldn't cancel the
      # rest and hide which areas are healthy. Each area is its own check.
      fail-fast: false
      # Areas run fully in parallel. Each area signs in as its OWN Jellyfin user
      # with its OWN DeviceId (see below), so there is no shared-session contention
      # to throttle around. If a run fails, the failure is real: fix the test, the
      # app, or the environment — never the parallelism, never with a retry.
      matrix:
        area:
          - name: smoke
            paths: .features-gen/e2e/features/smoke
          - name: auth
            paths: .features-gen/e2e/features/auth
          - name: playback
            paths: .features-gen/e2e/features/playback
          - name: search
            paths: .features-gen/e2e/features/search
          - name: library
            paths: .features-gen/e2e/features/library
          - name: playlists
            paths: .features-gen/e2e/features/playlists
          - name: home
            paths: .features-gen/e2e/features/home
          - name: album
            paths: .features-gen/e2e/features/album
          - name: artist
            paths: .features-gen/e2e/features/artist
          - name: song
            paths: .features-gen/e2e/features/song
          - name: downloads
            paths: .features-gen/e2e/features/downloads
          - name: offline
            paths: .features-gen/e2e/features/offline
          - name: audiobooks
            paths: .features-gen/e2e/features/audiobooks
          - name: native-playback
            paths: .features-gen/e2e/features/native-playback
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        # Chromium binary only — ubuntu-latest already ships the shared libs, so
        # we skip --with-deps (its apt step is what intermittently hangs). Retry
        # once on the occasional flaky download.
        run: npx playwright install chromium || npx playwright install chromium

      # Provision THIS area's dedicated Jellyfin user (cadence-e2e-<area>): create
      # it if missing, reset its password to TEST_PASSWORD, grant library access,
      # and verify sign-in. Fails the job if any of that fails — a missing user
      # can only produce a 25-minute sign-in hang later, which is worse.
      - name: Ensure this area's Jellyfin user exists
        env:
          VITE_JELLYFIN_URL: ${{ secrets.VITE_JELLYFIN_URL }}
          JELLYFIN_ADMIN_KEY: ${{ secrets.JELLYFIN_ADMIN_KEY }}
          AREA: ${{ matrix.area.name }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: bash scripts/ensure-e2e-users.sh

      # Warm up the Jellyfin auth path before the tests (the first auth after an
      # idle gap is slow). Fails the job on a 401 — wrong credentials are a real
      # failure, not something to let Playwright discover by timing out.
      - name: Warm up Jellyfin auth
        env:
          VITE_JELLYFIN_URL: ${{ secrets.VITE_JELLYFIN_URL }}
          # Warm as THIS area's dedicated user, so the warmed auth path matches
          # the user the tests actually sign in as.
          TEST_USERNAME: cadence-e2e-${{ matrix.area.name }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: bash scripts/warmup-jellyfin.sh

      # Ensure this area's user owns a playlist + follows an artist — the
      # library/home scenarios need that owned content. Idempotent; fails the job
      # if it cannot sign in or read the library.
      - name: Seed owned content for this area's user
        env:
          VITE_JELLYFIN_URL: ${{ secrets.VITE_JELLYFIN_URL }}
          # Every area now signs in as its OWN dedicated user (cadence-e2e-<area>,
          # provisioned on the server). Seed that same user so 'open the first
          # playlist' / followed-artist scenarios have their fixtures.
          TEST_USERNAME: cadence-e2e-${{ matrix.area.name }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: bash scripts/seed-e2e-user.sh

      # ONE attempt, no retry wrapper. Playwright runs with retries: 0 in CI too.
      # A failing scenario is a bug (test, app, or environment) that gets fixed —
      # it is never re-run until green. The job-level timeout-minutes above is the
      # only wall-clock cap, and it exists to surface hangs, not to absorb them.
      - name: Run acceptance tests (${{ matrix.area.name }})
        env:
          # The server URL is NOT in committed source — Vite reads it from this
          # secret at dev-server start (webServer in playwright.config.ts).
          VITE_JELLYFIN_URL: ${{ secrets.VITE_JELLYFIN_URL }}
          # DEDICATED Jellyfin user PER AREA (cadence-e2e-<area>), provisioned by
          # scripts/ensure-e2e-users.sh above. Password is shared (TEST_PASSWORD).
          TEST_USERNAME: cadence-e2e-${{ matrix.area.name }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # A DISTINCT Jellyfin DeviceId PER AREA: Jellyfin keys a playback session
          # per (user, DeviceId), so each area gets a fully independent session.
          E2E_DEVICE_ID: cadence-e2e-${{ matrix.area.name }}
          # Second user — only the playlists area's cross-user visibility scenario
          # needs one; dedicated so it can't collide with any other area's user.
          TEST_USERNAME_2: cadence-e2e-playlists2
          TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD }}
        run: npx bddgen && npx playwright test ${{ matrix.area.paths }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.area.name }}
          path: playwright-report/
          retention-days: 7
