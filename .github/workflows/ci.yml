name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: main-push runs and PR runs get SEPARATE groups so a PR run can
# never cancel an in-progress main run. That mattered because the iOS deploy is
# gated on a SUCCESSFUL main CI (workflow_run) — when a single shared group let a
# PR push cancel the main run, main CI showed "cancelled", so the deploy never
# fired. Now:
#   - push to main → group "ci-main", never cancelled (every merged commit is
#     verified end to end, and reaches `success` so iOS Deploy triggers).
#   - a PR → group "ci-pr-<ref>", cancel-in-progress so a new commit on that PR
#     supersedes its own older run.
# Trade-off: a PR run and a main run can briefly overlap on the shared Jellyfin
# (only during a merge), which the suite tolerates (workers:1 + retries keep each
# run gentle); the old strict repo-wide serialization was cancelling main, which
# was the worse failure.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, Test, Coverage, CRAP & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: File-length tripwire (max 300 lines)
        run: npm run check:lines

      - name: Feature coverage (every .feature maps to an acceptance area)
        run: npm run check:features

      - name: Unit tests with coverage (80% floor)
        run: npm run test:coverage

      - name: CRAP score analysis (threshold 15)
        run: npm run crap

      - name: Build
        run: npm run build

      - name: Bundle size budget
        # Fails if the gzipped entry/vendor/route chunks exceed .size-limit.json
        # — catches silent bundle bloat we control (deps, imports), unlike the
        # tunnel-noisy runtime metrics.
        run: npm run size

      - name: Lighthouse CI (a11y / best-practices / TBT / CLS)
        # Audits the built static shell (dist/, its own server — no Jellyfin
        # needed). GATES accessibility + best-practices (≥0.9) + TBT + CLS; LCP/
        # TTI/perf-score are WARN only (dominated by Ionic bundle parse + the
        # runtime Jellyfin tunnel, so noisy to gate). Report uploads to LHCI's
        # temporary public storage (link in the log).
        run: npm run lhci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  ios-tests:
    # Native Swift unit tests for the iOS now-playing bridge (MPNowPlayingInfoCenter
    # + MPRemoteCommandCenter). Host-less (compiles NowPlayingBridge.swift straight
    # into the bundle — no Capacitor/Pods link), so it's a quick simulator run that
    # guards the durable-Now-Playing + prev/next-track behavior that can't be caught
    # by the JS suite. Complements the native-playback Gherkin area (JS half).
    name: iOS Swift Tests
    # Self-hosted Mac Mini. This job also runs on pull_request, and self-hosted
    # runners on a public repo are unsafe for fork PRs (arbitrary code exec) —
    # so only run it for push-to-main or a PR authored by the repo owner.
    # Everyone else's PRs simply skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No setup-node cache on the self-hosted Mac mini: ~/.npm persists there, and saving it was a ~1.8 GB upload per run.
          package-manager-cache: false

      # The Podfile references pods by path under node_modules/@capacitor/*, so the
      # JS deps must be present before pod install / the xcodebuild resolves them.
      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: cd ios/App && pod install

      # Add the AppTests target + shared scheme to the (generated) xcodeproj.
      # Idempotent, so a committed target is fine too.
      - name: Ensure AppTests target
        run: cd ios/App && ruby add_test_target.rb

      - name: Run Swift unit tests
        run: |
          cd ios/App
          xcodebuild test \
            -workspace App.xcworkspace \
            -scheme AppTests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -quiet

  ios-launch-smoke:
    # Does the BUILT app launch in the simulator and reach a Home screen rendered
    # with real Jellyfin data? Nothing else checks that: an Xcode 27 build that
    # died at launch ("UIScene life cycle is required for apps built with this
    # SDK") passed every other job and reached App Store review. All logic is in
    # scripts/ios-launch-smoke.sh (runnable by hand); the deploy runs it too.
    name: iOS Launch Smoke Test
    # Same fork guard as ios-tests: self-hosted runner, so push-to-main or the
    # repo owner's own PRs only.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    env:
      # Unique per run: the Mac mini is shared, and a concurrent run must not
      # collide on the container name (the port is picked free by the script).
      E2E_JELLYFIN_NAME: cadence-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_OUT: ${{ github.workspace }}/ios-smoke-output
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: TEMP runner session probe
        run: |
          launchctl print "gui/$(id -u)" >/dev/null 2>&1 && echo "gui domain present" || echo "gui domain ABSENT"
          echo "console=$(stat -f %Su /dev/console) user=$(id -un)"

      - name: Launch the app and wait for Home
        run: bash scripts/ios-launch-smoke.sh

      - name: Upload screenshot + logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-launch-smoke
          path: |
            ios-smoke-output/home.png
            ios-smoke-output/requests.jsonl
            ios-smoke-output/device.log
            ios-smoke-output/app.stdout
            ios-smoke-output/jellyfin-up.log
            ios-smoke-output/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

      # The script's own trap cleans up; this covers a cancelled job.
      - name: Remove the smoke simulator + Jellyfin
        if: always()
        run: bash scripts/ios-launch-smoke.sh cleanup

  acceptance:
    # One job per feature area, each its own independent check, so a red X points
    # at the area that broke. Every area runs against a HERMETIC Jellyfin: a
    # throwaway container on the runner holding a generated fixture library
    # (scripts/e2e-jellyfin.sh + scripts/e2e-fixtures.sh). Nothing here touches
    # the maintainer's production server — no tunnel, no junk users, no cold
    # starts, no shared state between areas. The only live-server check is the
    # opt-in `smoke-live` job below.
    name: Acceptance Tests (${{ matrix.area.name }})
    runs-on: ubuntu-latest
    # Hard cap per area. It surfaces hangs (e.g. sign-in never succeeding) as a
    # fast red X with the real error in the log — it is not a retry budget.
    timeout-minutes: 20
    strategy:
      # Let every area run even if one fails — a lone failure shouldn't cancel the
      # rest and hide which areas are healthy. Each area is its own check.
      fail-fast: false
      # Areas run fully in parallel, each on its own runner with its own server.
      # If a run fails, the failure is real: fix the test, the app, or the
      # fixtures — never the parallelism, never with a retry.
      matrix:
        area:
          - name: smoke
            paths: .features-gen/e2e/features/smoke
          - name: auth
            paths: .features-gen/e2e/features/auth
          - name: playback
            paths: .features-gen/e2e/features/playback
          - name: search
            paths: .features-gen/e2e/features/search
          - name: library
            paths: .features-gen/e2e/features/library
          - name: playlists
            paths: .features-gen/e2e/features/playlists
          - name: home
            paths: .features-gen/e2e/features/home
          - name: album
            paths: .features-gen/e2e/features/album
          - name: artist
            paths: .features-gen/e2e/features/artist
          - name: song
            paths: .features-gen/e2e/features/song
          - name: downloads
            paths: .features-gen/e2e/features/downloads
          - name: offline
            paths: .features-gen/e2e/features/offline
          - name: audiobooks
            paths: .features-gen/e2e/features/audiobooks
          - name: native-playback
            paths: .features-gen/e2e/features/native-playback
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome for Playwright
        timeout-minutes: 5
        # Google Chrome (not Chromium): it ships the AAC decoder that m4b
        # audiobooks need, so playback scenarios exercise real audio in CI.
        run: npx playwright install chrome

      # Start the hermetic Jellyfin: container up, fixture library rendered with
      # the bundled jellyfin-ffmpeg, setup wizard completed, Music + Books
      # libraries scanned, one user per area created. Exports VITE_JELLYFIN_URL,
      # JELLYFIN_ADMIN_KEY, TEST_PASSWORD(_2) and TEST_USERNAME_2 to later steps.
      # Fails the job loudly if any of that fails — ~15 s when healthy.
      - name: Start the e2e Jellyfin
        run: bash scripts/e2e-jellyfin.sh up

      # Seed this area's user: an owned playlist, a followed artist, a liked song.
      - name: Seed owned content for this area's user
        env:
          TEST_USERNAME: cadence-e2e-${{ matrix.area.name }}
        run: bash scripts/seed-e2e-user.sh

      # ONE attempt, no retry wrapper. Playwright runs with retries: 0 in CI too.
      # A failing scenario is a bug (test, app, or fixtures) that gets fixed —
      # it is never re-run until green. The job-level timeout-minutes above is the
      # only wall-clock cap, and it exists to surface hangs, not to absorb them.
      - name: Run acceptance tests (${{ matrix.area.name }})
        env:
          # DEDICATED Jellyfin user PER AREA (cadence-e2e-<area>), created by
          # e2e-jellyfin.sh above; TEST_PASSWORD was exported by the same step.
          TEST_USERNAME: cadence-e2e-${{ matrix.area.name }}
          # A DISTINCT Jellyfin DeviceId PER AREA: Jellyfin keys a playback session
          # per (user, DeviceId), so each area gets a fully independent session.
          E2E_DEVICE_ID: cadence-e2e-${{ matrix.area.name }}
        run: npx bddgen && npx playwright test ${{ matrix.area.paths }}

      # A red scenario often starts as a server-side error (e.g. a 500 on a
      # stream). Print the e2e Jellyfin's own log so the cause is in the job.
      - name: Jellyfin server log (on failure)
        if: failure()
        run: docker logs cadence-e2e-jellyfin 2>&1 | tail -400

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.area.name }}
          path: playwright-report/
          retention-days: 7

  smoke-live:
    # The ONE check against a real, remote Jellyfin: the smoke area against the
    # public DEMO instance (never production). Catches what a container cannot —
    # TLS, a tunnel, a real server version drift. Opt-in: it runs only when the
    # demo secrets are configured (an existing non-admin demo user; no
    # provisioning, no admin key). Without them the job completes as a no-op
    # that says so, instead of failing or silently pretending to have run.
    #   gh secret set DEMO_JELLYFIN_URL   --body https://jellyfin-demo.example
    #   gh secret set DEMO_TEST_USERNAME  --body cadence-smoke
    #   gh secret set DEMO_TEST_PASSWORD  --body '…'
    name: Smoke against the live demo server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_JELLYFIN_URL: ${{ secrets.DEMO_JELLYFIN_URL }}
      TEST_USERNAME: ${{ secrets.DEMO_TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.DEMO_TEST_PASSWORD }}
      E2E_DEVICE_ID: cadence-e2e-smoke-live
    steps:
      - name: Check for demo credentials
        id: creds
        run: |
          if [ -z "$VITE_JELLYFIN_URL" ] || [ -z "$TEST_USERNAME" ] || [ -z "$TEST_PASSWORD" ]; then
            echo "::notice::smoke-live skipped: DEMO_JELLYFIN_URL / DEMO_TEST_USERNAME / DEMO_TEST_PASSWORD are not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.run == 'true'

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.run == 'true'
        run: npm ci

      - name: Install Google Chrome for Playwright
        if: steps.creds.outputs.run == 'true'
        timeout-minutes: 5
        run: npx playwright install chrome

      # Warm the demo's auth path first; a 401 here is a real failure (wrong
      # demo credentials) and is reported as such, not as a Playwright timeout.
      - name: Warm up the demo server
        if: steps.creds.outputs.run == 'true'
        run: bash scripts/warmup-jellyfin.sh

      - name: Run the smoke area against the demo
        if: steps.creds.outputs.run == 'true'
        run: npx bddgen && npx playwright test .features-gen/e2e/features/smoke

      - name: Upload Playwright report
        if: always() && steps.creds.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-smoke-live
          path: playwright-report/
          retention-days: 7
