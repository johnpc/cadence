name: iOS Deploy

# Post-merge only (workflow_run after CI on main, or a manual dispatch) — never on
# pull_request, so fork PRs can't reach the self-hosted Mac mini.
#
# The shared workflow (johnpc/ci-workflows) builds the web bundle with the
# diagnostics keys baked in (secret-env), syncs Capacitor + pods, runs Cadence's
# own launch smoke as the gate (it signs into a hermetic Jellyfin through
# scripts/ios-smoke-proxy.py and must reach Home with real data, in a Release
# simulator build of the exact dist it ships), then signs from the CI keychain,
# archives, uploads, and hands the build to the external TestFlight group. Every
# path it writes is per-job ($RUNNER_TEMP). A version conflict bumps the patch
# version and records it through an auto-merging PR opened with DEPLOY_PAT, so
# that PR runs CI itself and merges once main's required checks pass. It never
# submits for App Store review.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: johnpc/ci-workflows/.github/workflows/ios-deploy-capacitor.yml@v1
    secrets: inherit
    with:
      bundle-id: com.johncorser.cadence
      archive-name: Cadence
      ref: main
      external-beta: true
      secret-env: VITE_DIAGNOSTICS_KEY VITE_DIAGNOSTICS_URL
      # SMOKE_WEB_BUILD=0: smoke the dist the shared workflow just built and synced.
      # The trap removes this run's simulator + Jellyfin even if the smoke dies
      # before its own cleanup runs.
      smoke-command: export SMOKE_RUN_TAG=deploy-${{ github.run_id }}-${{ github.run_attempt }}; trap 'bash scripts/ios-launch-smoke.sh cleanup' EXIT; SMOKE_WEB_BUILD=0 SMOKE_CONFIGURATION=Release bash scripts/ios-launch-smoke.sh
      # Evidence only: ios-smoke-output/ also holds the smoke's DerivedData.
      smoke-artifact-paths: |
        ios-smoke-output/home.png
        ios-smoke-output/requests.jsonl
        ios-smoke-output/device.log
        ios-smoke-output/app.stdout
        ios-smoke-output/xcodebuild.log
      bump: patch
      timeout-minutes: 90
